<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Macro · מעקב תזונה</title>
<meta name="description" content="A fast one-tap nutrition logger — kcal & protein.">
<meta name="theme-color" content="#F3EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="assets/labs-font.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- labs shape sprite (inlined once) -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden" focusable="false"><defs>
  <symbol id="shape-circle" viewBox="0 0 360 360"><circle cx="180" cy="180" r="160.5" fill="currentColor"/></symbol>
  <symbol id="shape-squircle" viewBox="0 0 360 360"><rect x="19.5" y="19.5" width="320.85" height="320.85" rx="59.76" fill="currentColor"/></symbol>
  <symbol id="shape-hexagon" viewBox="0 0 360 360"><path fill="currentColor" transform="translate(19.5 1.5)" d="M132.896 7.43C149.932-2.48 170.922-2.48 187.958 7.43L293.323 68.72C310.359 78.63 320.854 96.95 320.854 116.77L320.854 239.35C320.854 259.17 310.359 277.48 293.323 287.39L187.958 348.68C170.922 358.59 149.932 358.59 132.896 348.68L27.531 287.39C10.495 277.48 0 259.17 0 239.35L0 116.77C0 96.95 10.495 78.63 27.531 68.72L132.896 7.43Z"/></symbol>
  <symbol id="shape-clover" viewBox="0 0 360 360"><path fill="currentColor" transform="translate(17 17)" d="M89.848 0C119.388 0 145.597 14.172 161.972 36.049 162.482 36.73 163.51 36.73 164.02 36.05 180.396 14.173 206.605 0 236.145 0 285.764 0 325.989 39.988 325.989 89.314 325.989 119.25 311.171 145.745 288.429 161.95 287.716 162.459 287.716 163.528 288.429 164.036 311.172 180.241 325.992 206.737 325.992 236.675 325.992 286 285.767 325.986 236.147 325.986 206.606 325.986 180.395 311.813 164.019 289.933 163.509 289.252 162.481 289.252 161.971 289.933 145.596 311.813 119.386 325.987 89.845 325.987 40.225 325.987 0 286.001 0 236.676 0 206.737 14.82 180.24 37.564 164.035 38.277 163.527 38.278 162.458 37.564 161.949 14.822 145.744 0.004 119.249 0.004 89.312 0.004 39.986 40.228 0 89.848 0Z"/></symbol>
</defs></svg>

<div class="bg-shapes" aria-hidden="true">
  <svg class="labs-shape" style="--c:var(--green);--s:20rem;inset-inline-start:-6rem;top:-4rem"><use href="#shape-hexagon"/></svg>
  <svg class="labs-shape" style="--c:var(--blue);--s:14rem;inset-inline-end:-4rem;top:2rem"><use href="#shape-circle"/></svg>
</div>

<main class="app" id="app">

  <header class="top">
    <div class="top__l">
      <div class="brand">Macro</div>
      <button class="daynav" id="dayPrev" aria-label="prev day">‹</button>
      <div class="date" id="dateLabel">היום</div>
      <button class="daynav" id="dayNext" aria-label="next day">›</button>
    </div>
    <button class="iconbtn" id="btnSettings" aria-label="הגדרות" title="הגדרות">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7.3 7.3 0 0 0-2-1.2l-.3-2.5H8.3L8 4.1a7.3 7.3 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7.4 7.4 0 0 0 3.6 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7.3 7.3 0 0 0 2 1.2l.3 2.5h3.4l.3-2.5a7.3 7.3 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
    </button>
  </header>

  <section class="rings" id="rings">
    <div class="ring ring--protein" id="ringProtein">
      <svg viewBox="0 0 120 120" class="ring__svg">
        <circle class="ring__track" cx="60" cy="60" r="52"/>
        <circle class="ring__fill" id="ringProteinFill" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring__center">
        <div class="ring__val" id="proteinVal">0</div>
        <div class="ring__unit" data-i18n="ring_protein">חלבון · g</div>
        <div class="ring__target" id="proteinTarget">/ 105</div>
      </div>
    </div>
    <div class="ring ring--kcal" id="ringKcal">
      <svg viewBox="0 0 120 120" class="ring__svg">
        <circle class="ring__track" cx="60" cy="60" r="52"/>
        <circle class="ring__fill" id="ringKcalFill" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring__center">
        <div class="ring__val" id="kcalVal">0</div>
        <div class="ring__unit" data-i18n="ring_kcal">קלוריות</div>
        <div class="ring__target" id="kcalTarget">/ 1200</div>
      </div>
    </div>
  </section>

  <div class="remaining" id="remaining"></div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search" type="search" inputmode="search" data-ph="search_ph" placeholder="חיפוש מנה…" autocomplete="off">
    </div>
    <button class="addbtn" id="btnAdd" data-i18n="add_food" aria-label="הוספת מנה">+ מנה</button>
  </div>

  <section class="tiles" id="tiles"></section>

  <section class="entries" id="entriesWrap">
    <div class="entries__head">
      <span id="entriesTitle" data-i18n="entries_title">מה אכלת היום</span>
      <span class="entries__count" id="entriesCount"></span>
    </div>
    <div id="entries"></div>
    <div class="entries__empty" id="entriesEmpty" data-i18n="entries_empty">עוד לא נרשם כלום. הקישי על מנה כדי להוסיף.</div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Add / Edit food sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheetFood" hidden role="dialog" aria-modal="true" aria-label="מנה">
  <div class="sheet__grip"></div>
  <div class="sheet__head">
    <h2 id="foodSheetTitle" data-i18n="food_new">מנה חדשה</h2>
    <button class="iconbtn" data-close aria-label="סגירה">✕</button>
  </div>
  <div class="sheet__body">
    <div class="fld ask" id="askField" hidden>
      <span data-i18n="ask_hint">תארי מנה במילים שלך ואמלא את השדות</span>
      <div class="ask__row">
        <input id="askBox" type="text" data-ph="ask_ph" placeholder="קערת קוטג׳ 5% עם מלפפון וקרקר" autocomplete="off">
        <button class="btn btn--primary ask__go" id="btnAsk" data-i18n="ask_btn">שאלי</button>
      </div>
      <p class="asknote" id="askNote" hidden></p>
    </div>
    <label class="fld fld--paste">
      <span data-i18n="paste_hint">הדביקי תשובה מ‑Gemini / Claude (kcal + protein) למילוי אוטומטי</span>
      <textarea id="pasteBox" rows="2" data-ph="paste_ph" placeholder="למשל: 240 קלוריות, 32 גרם חלבון…"></textarea>
    </label>
    <div class="grid2">
      <label class="fld"><span data-i18n="lbl_name_he">שם (עברית)</span><input id="fName" type="text"></label>
      <label class="fld"><span data-i18n="lbl_name_en">Name (English)</span><input id="fNameEn" type="text" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span data-i18n="lbl_kcal">קלוריות</span><input id="fKcal" type="number" inputmode="numeric" dir="ltr"></label>
      <label class="fld"><span data-i18n="lbl_protein">חלבון (g)</span><input id="fProtein" type="number" inputmode="decimal" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span data-i18n="lbl_carbs">פחמימות (g)</span><input id="fCarbs" type="number" inputmode="decimal" dir="ltr"></label>
      <label class="fld"><span data-i18n="lbl_fat">שומן (g)</span><input id="fFat" type="number" inputmode="decimal" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span data-i18n="lbl_serving">מנה / כמות</span><input id="fServing" type="text" data-ph="serving_ph" placeholder="1 גביע 170g"></label>
      <label class="fld"><span data-i18n="lbl_category">קטגוריה</span>
        <select id="fCategory">
          <option value="protein" data-i18n="cat_protein">חלבון</option>
          <option value="dairy" data-i18n="cat_dairy">חלב</option>
          <option value="carb" data-i18n="cat_carb">פחמימה</option>
          <option value="veg" data-i18n="cat_veg">ירקות</option>
          <option value="fruit" data-i18n="cat_fruit">פירות</option>
          <option value="fat" data-i18n="cat_fat">שומן</option>
          <option value="snack" data-i18n="cat_snack">חטיף</option>
          <option value="drink" data-i18n="cat_drink">משקה</option>
          <option value="meal" data-i18n="cat_meal">ארוחה</option>
        </select>
      </label>
    </div>
    <label class="chk"><input id="fFav" type="checkbox"> <span data-i18n="fav_label">מועדף (יופיע ראשון)</span></label>
  </div>
  <div class="sheet__foot">
    <button class="btn btn--ghost" id="btnDeleteFood" data-i18n="delete" hidden>מחיקה</button>
    <button class="btn btn--primary" id="btnSaveFood" data-i18n="save">שמירה</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="sheetSettings" hidden role="dialog" aria-modal="true" aria-label="הגדרות">
  <div class="sheet__grip"></div>
  <div class="sheet__head">
    <h2 data-i18n="settings">הגדרות</h2>
    <button class="iconbtn" data-close aria-label="סגירה">✕</button>
  </div>
  <div class="sheet__body">
    <div class="grid2">
      <label class="fld"><span data-i18n="lbl_target_kcal">יעד קלוריות</span><input id="sKcal" type="number" inputmode="numeric" dir="ltr"></label>
      <label class="fld"><span data-i18n="lbl_target_protein">יעד חלבון (g)</span><input id="sProtein" type="number" inputmode="numeric" dir="ltr"></label>
    </div>
    <label class="fld"><span data-i18n="lbl_lang">שפת ממשק</span>
      <select id="sLang"><option value="he">עברית</option><option value="en">English</option></select>
    </label>

    <h3 class="sec" data-i18n="sec_ai">התייעצות על מנות</h3>
    <label class="fld"><span data-i18n="lbl_api_key">מפתח Anthropic API</span>
      <input id="sApiKey" type="password" dir="ltr" autocomplete="off" spellcheck="false" data-ph="api_key_ph" placeholder="sk-ant-…">
    </label>
    <label class="fld"><span data-i18n="lbl_model">מודל</span>
      <input id="sModel" type="text" dir="ltr" autocomplete="off" spellcheck="false">
    </label>

    <h3 class="sec" data-i18n="sec_backup">גיבוי</h3>
    <label class="fld"><span>Google OAuth client ID</span>
      <input id="sGoogleId" type="text" dir="ltr" autocomplete="off" spellcheck="false" placeholder="…apps.googleusercontent.com">
    </label>
    <p class="hint" id="backupStatus"></p>
    <div class="settings-actions">
      <button class="btn btn--ghost" id="btnShare" data-i18n="share_export">שיתוף גיבוי</button>
      <button class="btn btn--ghost" id="btnDrive" data-i18n="drive_backup_now">גיבוי עכשיו</button>
    </div>
    <div class="settings-actions">
      <button class="btn btn--ghost" id="btnExport" data-i18n="export">ייצוא גיבוי (JSON)</button>
      <button class="btn btn--ghost" id="btnImport" data-i18n="import">ייבוא מגיבוי</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <p class="hint" id="verHint"></p>
  </div>
  <div class="sheet__foot">
    <button class="btn btn--primary" data-close data-i18n="close">סגירה</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

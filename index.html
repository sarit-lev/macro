<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro · מעקב תזונה</title>
<meta name="description" content="A fast one-tap nutrition logger — kcal & protein.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Control layer, top: floating glass controls over a soft scroll edge -->
<header class="nav" id="nav">
  <div class="nav__edge" aria-hidden="true"></div>
  <div class="nav__bar">
    <div class="glass stepper" role="group">
      <button class="stepper__btn" id="dayPrev" data-i18n-aria="prev_day" aria-label="היום הקודם">
        <svg class="chev chev--back" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="stepper__btn" id="dayNext" data-i18n-aria="next_day" aria-label="היום הבא">
        <svg class="chev chev--fwd" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="nav__title" id="navTitle" aria-hidden="true">היום</div>
    <button class="glass glass--circle" id="btnSettings" data-i18n-aria="settings" aria-label="הגדרות">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M9.49 5.46 10.03 3.12h3.94l.54 2.34a7 7 0 0 1 1.9 1.1l2.3-.71 1.97 3.41-1.77 1.64a7 7 0 0 1 0 2.2l1.77 1.64-1.97 3.41-2.3-.71a7 7 0 0 1-1.9 1.1l-.54 2.34h-3.94l-.54-2.34a7 7 0 0 1-1.9-1.1l-2.3.71-1.97-3.41 1.77-1.64a7 7 0 0 1 0-2.2L3.32 9.26l1.97-3.41 2.3.71a7 7 0 0 1 1.9-1.1Z"/></svg>
    </button>
  </div>
</header>

<!-- Content layer -->
<main class="app" id="app">

  <h1 class="largetitle" id="dateLabel">היום</h1>

  <section class="summary" aria-label="סיכום יומי">
    <div class="ring ring--protein" id="ringProtein">
      <svg viewBox="0 0 120 120" class="ring__svg" aria-hidden="true">
        <circle class="ring__track" cx="60" cy="60" r="52"/>
        <circle class="ring__fill" id="ringProteinFill" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring__center">
        <div class="ring__val" id="proteinVal">0</div>
        <div class="ring__unit" data-i18n="ring_protein">חלבון · g</div>
        <div class="ring__target" id="proteinTarget">/ 150</div>
      </div>
    </div>
    <div class="ring ring--kcal" id="ringKcal">
      <svg viewBox="0 0 120 120" class="ring__svg" aria-hidden="true">
        <circle class="ring__track" cx="60" cy="60" r="52"/>
        <circle class="ring__fill" id="ringKcalFill" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring__center">
        <div class="ring__val" id="kcalVal">0</div>
        <div class="ring__unit" data-i18n="ring_kcal">קלוריות</div>
        <div class="ring__target" id="kcalTarget">/ 1400</div>
      </div>
    </div>
  </section>

  <p class="remaining" id="remaining"></p>

  <section class="section">
    <div class="section__head">
      <h2 data-i18n="my_foods">המנות שלי</h2>
      <button class="textbtn" id="btnEdit" data-i18n="edit">עריכה</button>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="section" id="entriesWrap">
    <div class="section__head">
      <h2 id="entriesTitle" data-i18n="entries_title">מה אכלת היום</h2>
      <span class="section__count" id="entriesCount"></span>
    </div>
    <div class="list" id="entries"></div>
    <p class="empty" id="entriesEmpty" data-i18n="entries_empty">עוד לא נרשם כלום. הקישי על מנה כדי להוסיף.</p>
  </section>

</main>

<!-- Control layer, bottom: search and the one primary action, in reach of the thumb -->
<div class="dock">
  <div class="dock__edge" aria-hidden="true"></div>
  <div class="dock__bar">
    <div class="glass search" id="searchBox">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
      <input id="search" type="search" inputmode="search" enterkeyhint="search" data-ph="search_ph" placeholder="חיפוש מנה…" autocomplete="off" data-i18n-aria="search_ph" aria-label="חיפוש מנה">
      <!-- clear: only when there is text; empties the field, keeps focus and the keyboard -->
      <button class="search__clear" id="btnSearchClear" type="button" hidden data-i18n-aria="clear" aria-label="ניקוי">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button class="glass glass--circle glass--tint" id="btnAdd" data-i18n-aria="add_food_aria" aria-label="הוספת מנה">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <!-- leaves search mode -->
    <button class="glass glass--circle" id="btnSearchClose" type="button" hidden data-i18n-aria="close_search" aria-label="סגירת החיפוש">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Add / Edit food sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheetFood" hidden role="dialog" aria-modal="true" aria-labelledby="foodSheetTitle">
  <div class="sheet__grab" aria-hidden="true"></div>
  <div class="sheet__bar">
    <button class="textbtn" data-close data-i18n="cancel">ביטול</button>
    <h2 id="foodSheetTitle" data-i18n="food_new">מנה חדשה</h2>
    <button class="textbtn textbtn--strong" id="btnSaveFood" data-i18n="save">שמירה</button>
  </div>
  <div class="sheet__body">
    <div class="card ask" id="askField" hidden>
      <span class="ask__hint" data-i18n="ask_hint">תארי מנה במילים שלך ואמלא את השדות</span>
      <div class="ask__row">
        <input id="askBox" type="text" enterkeyhint="send" data-ph="ask_ph" placeholder="קערת קוטג׳ 5% עם מלפפון וקרקר" autocomplete="off">
        <button class="btn btn--primary ask__go" id="btnAsk" data-i18n="ask_btn">שאלי</button>
      </div>
      <button class="btn btn--secondary ask__photo" id="btnPhoto" data-i18n="photo_btn">📷 צילום מנה</button>
      <input id="dishPhoto" type="file" accept="image/*" hidden>
      <p class="asknote" id="askNote" hidden></p>
      <div class="dish" id="dishResult" hidden></div>
    </div>

    <label class="fld">
      <span class="fld__label" data-i18n="paste_hint">הדביקי תשובה מ‑Gemini / Claude (kcal + protein) למילוי אוטומטי</span>
      <textarea id="pasteBox" rows="2" data-ph="paste_ph" placeholder="למשל: 240 קלוריות, 32 גרם חלבון…"></textarea>
    </label>

    <div class="grid2">
      <label class="fld"><span class="fld__label" data-i18n="lbl_name_he">שם (עברית)</span><input id="fName" type="text"></label>
      <label class="fld"><span class="fld__label" data-i18n="lbl_name_en">Name (English)</span><input id="fNameEn" type="text" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span class="fld__label" data-i18n="lbl_kcal">קלוריות</span><input id="fKcal" type="number" inputmode="numeric" dir="ltr"></label>
      <label class="fld"><span class="fld__label" data-i18n="lbl_protein">חלבון (g)</span><input id="fProtein" type="number" inputmode="decimal" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span class="fld__label" data-i18n="lbl_carbs">פחמימות (g)</span><input id="fCarbs" type="number" inputmode="decimal" dir="ltr"></label>
      <label class="fld"><span class="fld__label" data-i18n="lbl_fat">שומן (g)</span><input id="fFat" type="number" inputmode="decimal" dir="ltr"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span class="fld__label" data-i18n="lbl_serving">מנה / כמות</span><input id="fServing" type="text" data-ph="serving_ph" placeholder="1 גביע 170g"></label>
      <label class="fld"><span class="fld__label" data-i18n="lbl_category">קטגוריה</span>
        <select id="fCategory">
          <option value="protein" data-i18n="cat_protein">חלבון</option>
          <option value="dairy" data-i18n="cat_dairy">חלב</option>
          <option value="carb" data-i18n="cat_carb">פחמימה</option>
          <option value="veg" data-i18n="cat_veg">ירקות</option>
          <option value="fruit" data-i18n="cat_fruit">פירות</option>
          <option value="fat" data-i18n="cat_fat">שומן</option>
          <option value="snack" data-i18n="cat_snack">חטיף</option>
          <option value="drink" data-i18n="cat_drink">משקה</option>
          <option value="meal" data-i18n="cat_meal">ארוחה</option>
        </select>
      </label>
    </div>

    <label class="card row">
      <span data-i18n="fav_label">מועדף (יופיע ראשון)</span>
      <input class="switch" id="fFav" type="checkbox" role="switch">
    </label>

    <button class="card row row--destructive" id="btnDeleteFood" data-i18n="delete" hidden>מחיקה</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="sheetSettings" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet__grab" aria-hidden="true"></div>
  <div class="sheet__bar">
    <span></span>
    <h2 id="settingsTitle" data-i18n="settings">הגדרות</h2>
    <button class="textbtn textbtn--strong" data-close data-i18n="done">סיום</button>
  </div>
  <div class="sheet__body">
    <div class="grid2">
      <label class="fld"><span class="fld__label" data-i18n="lbl_target_kcal">יעד קלוריות</span><input id="sKcal" type="number" inputmode="numeric" dir="ltr"></label>
      <label class="fld"><span class="fld__label" data-i18n="lbl_target_protein">יעד חלבון (g)</span><input id="sProtein" type="number" inputmode="numeric" dir="ltr"></label>
    </div>
    <label class="fld"><span class="fld__label" data-i18n="lbl_lang">שפת ממשק</span>
      <select id="sLang"><option value="he">עברית</option><option value="en">English</option></select>
    </label>

    <h3 class="sec" data-i18n="sec_ai">התייעצות על מנות</h3>
    <label class="fld"><span class="fld__label" data-i18n="lbl_api_key">מפתח Anthropic API</span>
      <input id="sApiKey" type="password" dir="ltr" autocomplete="off" spellcheck="false" data-ph="api_key_ph" placeholder="sk-ant-…">
    </label>
    <label class="fld"><span class="fld__label" data-i18n="lbl_model">מודל</span>
      <input id="sModel" type="text" dir="ltr" autocomplete="off" spellcheck="false">
    </label>

    <h3 class="sec" data-i18n="sec_backup">גיבוי</h3>
    <label class="fld"><span class="fld__label">Google OAuth client ID</span>
      <input id="sGoogleId" type="text" dir="ltr" autocomplete="off" spellcheck="false" placeholder="…apps.googleusercontent.com">
    </label>
    <p class="hint" id="backupStatus"></p>
    <div class="actions">
      <button class="btn btn--secondary" id="btnShare" data-i18n="share_export">שיתוף גיבוי</button>
      <button class="btn btn--secondary" id="btnDrive" data-i18n="drive_backup_now">גיבוי עכשיו</button>
    </div>
    <div class="actions">
      <button class="btn btn--secondary" id="btnExport" data-i18n="export">ייצוא גיבוי (JSON)</button>
      <button class="btn btn--secondary" id="btnImport" data-i18n="import">ייבוא מגיבוי</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <p class="hint" id="verHint"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
